name: Deploy Laiky Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Publicar sitio en S3 y CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Obtener nombre del bucket y distribucion
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name laiky-backend --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name laiky-backend --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Subir frontend a S3
        run: aws s3 sync frontend/ s3://${{ steps.stack.outputs.bucket }} --delete

      - name: Invalidar cache de CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.stack.outputs.dist_id }} --paths "/*"
