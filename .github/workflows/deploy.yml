name: Deploy Laiky Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/mi-proyecto-serverless/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: backend/mi-proyecto-serverless

jobs:
  validate:
    name: Validar template (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar cfn-lint
        run: pip install cfn-lint

      - name: Validar template.yaml
        run: cfn-lint template.yaml

  build:
    name: Build (sam build)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: SAM build
        run: sam build

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: backend/mi-proyecto-serverless/.aws-sam
          include-hidden-files: true

  deploy:
    name: Deploy a AWS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: backend/mi-proyecto-serverless/.aws-sam

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM deploy
        run: >
          sam deploy
          --stack-name laiky-backend
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides ProjectName=laiky AdminEmail=${{ secrets.ADMIN_EMAIL }}
